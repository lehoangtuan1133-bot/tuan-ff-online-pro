<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { font-family: Arial; background: #0a0e14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.box { background: #1a2533; padding: 30px; border-radius: 10px; text-align: center; width: 300px; }
input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #0d1622; color: #fff; box-sizing: border-box;}
button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;}
#msg { color: #e74c3c; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h2>🛡️ ADMIN LOGIN</h2>
    <input type="text" id="user" placeholder="Tài khoản" value="Admin">
    <input type="password" id="pass" placeholder="Mật khẩu">
    <button id="btnLogin" onclick="login()">Đăng nhập</button>
    <div id="msg"></div>
  </div>

<script>
  const SERVER_URL = 'https://tuan-ff-online-pro-1.onrender.com';
  
  async function login() {
    const btn = document.getElementById('btnLogin');
    const msg = document.getElementById('msg');
    btn.innerText = 'Đang kiểm tra...';
    msg.innerText = '';
    
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;

    try {
      const res = await fetch(SERVER_URL + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      
      const data = await res.json();
      
      if (res.ok && data.token) {
        localStorage.setItem('adminToken', data.token);
        alert('Đăng nhập thành công!');
        window.location.href = SERVER_URL + '/index.html'; // Chuyển về game
      } else {
        msg.innerText = data.error || 'Sai tài khoản hoặc mật khẩu';
        btn.innerText = 'Đăng nhập';
      }
    } catch (err) {
      msg.innerText = 'Lỗi kết nối Server!';
      btn.innerText = 'Đăng nhập';
    }
  }
</script>
</body>
</html>
